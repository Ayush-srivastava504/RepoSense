# Starter server block for the FRONTEND. Copy to /etc/nginx/conf.d/intern-flow.in.conf next to your
# existing api.intern-flow.in config, then run certbot to add HTTPS (see docs/SELF_HOSTING.md).
server {
    listen 80;
    listen [::]:80;
    server_name intern-flow.in www.intern-flow.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
