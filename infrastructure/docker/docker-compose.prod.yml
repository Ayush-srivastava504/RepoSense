# Full self-hosted stack: frontend + API + Postgres + Redis + automatic HTTPS.
#
#   cd infrastructure/docker
#   cp .env.prod.example .env      # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is exposed to the internet (ports 80/443). Postgres, Redis, the API
# and the web app live on a private Docker network.
#
# Optional local-LLM services (resume AI, RAG) are behind the "ai" profile:
#   docker compose -f docker-compose.prod.yml --profile ai up -d

name: reposense

services:
  postgres:
    image: postgres:18
    container_name: reposense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: internship_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internship_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: reposense-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: reposense-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      # Special characters in POSTGRES_PASSWORD would break this URL; use `openssl rand -hex 24`.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/internship_db
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: '["https://${DOMAIN}","https://www.${DOMAIN}"]'
      FRONTEND_URL: https://${DOMAIN}
      RAG_SERVICE_URL: http://rag:8001
      NEURAL_GENERATOR_URL: http://neural-generator:8002
    volumes:
      - generated_resumes:/app/generated_resumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [internal]

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time. Rebuild (up -d --build) after changing.
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_LOGO_DEV_TOKEN: ${NEXT_PUBLIC_LOGO_DEV_TOKEN:-}
        # Build-time pre-rendering; harmless if the API isn't reachable yet on first build.
        API_BASE_URL: https://${API_DOMAIN}
    container_name: reposense-web
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API over the private network (fast, no TLS hop).
      API_BASE_URL: http://api:8000
      # Must equal INTERNAL_API_KEY on the api service (same .env) so SSR isn't rate-limited.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: reposense-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [internal]

  # ---------- optional: local LLM / RAG (needs ~2 GB extra RAM) ----------
  neural-generator:
    profiles: ["ai"]
    image: ghcr.io/ayush-srivastava504/reposense-neural:latest
    container_name: neural-generator
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      MODEL_PATH: /app/models/Qwen3-0.6B-Q4_K_M.gguf
      LLM_N_THREADS: 4
      LLM_N_CTX: 4096
      LLM_N_GPU_LAYERS: 0
    mem_limit: 1024m
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8002", "--timeout-keep-alive", "600"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks: [internal]

  rag:
    profiles: ["ai"]
    image: ghcr.io/ayush-srivastava504/reposense-rag:latest
    container_name: rag
    restart: unless-stopped
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - rag_data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    environment:
      PYTHONPATH: /app
      HF_HOME: /root/.cache/huggingface
      LLM_ENDPOINT: http://neural-generator:8002/generate
      VECTOR_STORE_PATH: /app/data/faiss_index
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    depends_on:
      neural-generator:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  generated_resumes:
  caddy_data:
  caddy_config:
  rag_data:
  huggingface_cache:
