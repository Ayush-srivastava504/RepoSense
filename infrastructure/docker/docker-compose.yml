# Production stack for intern-flow.in, sized for one small instance (2 GB RAM + 2 GB swap,
# e.g. EC2 t3a.small in ap-south-1 / Mumbai). See docs/DEPLOYMENT_GUIDE.md.
#
# Always running:  caddy (HTTPS) -> web (Next.js) -> api (FastAPI) -> postgres, redis
# On a schedule:   crawler, hackathon-crawler (profile "jobs"; started by cron, exit when done)
#
# All images are built by GitHub Actions (.github/workflows/backend-cicd.yml) and pulled from GHCR:
# building Next.js or the crawler on a 2 GB server runs out of memory.
# Rough memory budget: postgres 384M + redis 64M + api 448M + web 384M + caddy 64M ~= 1.35 GB,
# leaving room for one crawler run (768M, with swap as the safety margin).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    container_name: reposense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/docker/.env}
      POSTGRES_DB: internship_db
    # Tuned for ~384 MB. Defaults assume a bigger machine.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - max_connections=40
    ports:
      - "127.0.0.1:5432:5432"   # host-only: company-intel and backups connect via localhost
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 384m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reposense-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/ayush-srivastava504/reposense-api:latest
    container_name: reposense-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      REDIS_URL: redis://redis:6379
    volumes:
      - ./google-service-account.json:/app/infrastructure/docker/google-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 448m
    logging: *logging
    entrypoint: ["/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: ghcr.io/ayush-srivastava504/reposense-web:latest
    container_name: reposense-web
    restart: unless-stopped
    environment:
      # Server-side rendering calls the API over the Docker network (fast, no TLS hop).
      API_BASE_URL: http://api:8000
      # Same value as INTERNAL_API_KEY in .env (read by the api) so SSR is not rate limited.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      NODE_OPTIONS: --max-old-space-size=320
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    container_name: reposense-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infrastructure/docker/.env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infrastructure/docker/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    mem_limit: 64m
    logging: *logging

  # ---- Scheduled jobs (not started by `up`; cron runs them, see docs/DEPLOYMENT_GUIDE.md) ----
  crawler:
    image: ghcr.io/ayush-srivastava504/reposense-crawler:latest
    container_name: job-crawler
    profiles: ["jobs"]
    restart: "no"
    command: ["python", "src/index.py", "--max-pages", "2"]
    env_file:
      - .env
    environment:
      HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  hackathon-crawler:
    image: ghcr.io/ayush-srivastava504/reposense-crawler:latest
    container_name: hackathon-crawler
    profiles: ["jobs"]
    restart: "no"
    command: ["python", "src/hackathon_index.py"]
    env_file:
      - .env
    environment:
      HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
