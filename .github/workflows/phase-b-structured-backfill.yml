# Phase B (INDEXING_RECOVERY_PLAN.md) — scheduled backfill of the
# structured job-detail columns (allowed_degrees/required_skills/etc.,
# migrations/021_structured_job_details.sql) via
# services/api/scripts/enrich_all_content.py --target structured --bulk.
#
# NOTE ON THIS FILE: .github/workflows/ is excluded from the uploaded zip
# (create_zip.py skips every dotfile/dotdir), so the existing
# content-enrichment.yml and phase-f-priority-index.yml this is modeled
# on were not available to copy from directly. This was authored from
# the SSH/EC2 deploy pattern documented in docs/DEPLOYMENT_GUIDE.md
# (secrets.EC2_HOST / secrets.EC2_SSH_KEY, user ec2-user, repo at
# /home/ec2-user/RepoSense, services run via `docker compose exec api`
# against the `api` service in infrastructure/docker/docker-compose.yml).
# Diff this against the real content-enrichment.yml once you can see it
# — the SSH action version/step shape may differ from what's below.

name: Phase B — structured field backfill

on:
  schedule:
    # Daily at 03:30 UTC — offset from content-enrichment.yml's run
    # (comments say that one runs daily too) so the two don't SSH into
    # the box and call Groq at the same time. Adjust the offset once you
    # know content-enrichment.yml's actual cron.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max rows to process this run'
        required: false
        default: '300'

jobs:
  structured-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run structured backfill
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml \
              exec -T api python scripts/enrich_all_content.py \
              --target structured --bulk \
              --limit "${{ github.event.inputs.limit || '300' }}"
