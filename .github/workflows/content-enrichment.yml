name: Job Content Enrichment


# Postgres lives on the same EC2 box as the API/crawler containers and is
# not exposed to the internet — a GitHub-hosted runner has no way to reach
# it directly (hosted runners don't have a fixed IP you could even
# allowlist). So instead of connecting out to the DB from the runner, this
# follows the exact same pattern as the "Deploy to EC2" job in
# backend-cicd.yml: SSH into the box with appleboy/ssh-action, then run the
# script *there*, against the DB's private/local address, using the same
# docker-compose .env the api container already runs with.

on:
  schedule:
    # 04:00 UTC daily = 09:30 IST — after the crawler's own scheduled runs,
    # so newly-scraped listings get picked up the same day.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max listings to enrich this run'
        required: false
        default: '100'
      force_stale:
        description: 'Also re-enrich old content (true/false)'
        required: false
        default: 'false'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Run enrichment batch on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          # Grok calls + rate-limit sleeps add up over a few hundred rows —
          # give this more headroom than the app deploy/smoke-test jobs get.
          command_timeout: 20m
          script_stop: true
          envs: LIMIT,FORCE_STALE
          script: |
            set -e
            cd /home/ec2-user/RepoSense

            LIMIT="${LIMIT:-100}"
            EXTRA_ARGS=""
            if [ "${FORCE_STALE:-false}" = "true" ]; then
              EXTRA_ARGS="--force-stale"
            fi

            echo "Running content enrichment (limit=$LIMIT, force_stale=${FORCE_STALE:-false})"

            # --entrypoint python skips entrypoint.sh (migrations + uvicorn
            # boot) and just runs the one-off script instead. env_file: .env
            # (already configured on this box for the api service) supplies
            # DATABASE_URL — add XAI_API_KEY to that same .env, this workflow
            # does not pass it in from GitHub secrets.
            docker compose -f infrastructure/docker/docker-compose.yml \
              run --rm --entrypoint python api \
              services/api/scripts/enrich_job_content.py --limit "$LIMIT" $EXTRA_ARGS
        env:
          LIMIT: ${{ github.event.inputs.limit || '100' }}
          FORCE_STALE: ${{ github.event.inputs.force_stale || 'false' }}
