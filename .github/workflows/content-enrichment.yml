name: Job Content Enrichment

# Fills in AI-generated overview copy for thin job/internship listings —
# the pages showing up as "Discovered - currently not indexed" in Search
# Console because the raw scraped description is too short/boilerplate for
# Google to bother indexing. See services/api/scripts/enrich_job_content.py.

on:
  schedule:
    # 04:00 UTC daily = 09:30 IST — after the crawler's own scheduled runs,
    # so newly-scraped listings get picked up the same day.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max listings to enrich this run'
        required: false
        default: '100'
      force_stale:
        description: 'Also re-enrich old content (true/false)'
        required: false
        default: 'false'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: services/api
        run: pip install -r requirements.txt

      - name: Run enrichment batch
        working-directory: services/api
        env:
          # Required. Without this secret the script logs a warning and
          # exits 0 (no-op) — safe to merge this workflow before the
          # secret is provisioned.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '100' }}"
          if [ "${{ github.event.inputs.force_stale || 'false' }}" = "true" ]; then
            ARGS="$ARGS --force-stale"
          fi
          python scripts/enrich_job_content.py $ARGS
