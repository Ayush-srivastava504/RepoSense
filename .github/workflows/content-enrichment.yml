name: Job Content Enrichment


# Postgres lives on the same EC2 box as the API/crawler containers and is
# not exposed to the internet — a GitHub-hosted runner has no way to reach
# it directly (hosted runners don't have a fixed IP you could even
# allowlist). So instead of connecting out to the DB from the runner, this
# follows the exact same pattern as the "Deploy to EC2" job in
# backend-cicd.yml: SSH into the box with appleboy/ssh-action, then run the
# script *there*, against the DB's private/local address, using the same
# docker-compose .env the api container already runs with.

on:
  schedule:
    # 04:00 UTC daily = 09:30 IST — after the crawler's own scheduled runs,
    # so newly-scraped listings get picked up the same day.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max listings to enrich this run'
        required: false
        default: '100'
      force_stale:
        description: 'Also re-enrich old content (true/false)'
        required: false
        default: 'false'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Run enrichment batch on EC2
        id: enrich
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          # Grok calls + rate-limit sleeps add up over a few hundred rows —
          # give this more headroom than the app deploy/smoke-test jobs get.
          command_timeout: 20m
          script_stop: true
          envs: LIMIT,FORCE_STALE
          # Needed so the next step can read what ran on the EC2 box back
          # on the runner (steps.enrich.outputs.stdout) and build the job
          # summary below — the script's own stdout is otherwise only
          # visible inside this step's raw log.
          capture_stdout: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense

            LIMIT="${LIMIT:-100}"
            EXTRA_ARGS=""
            if [ "${FORCE_STALE:-false}" = "true" ]; then
              EXTRA_ARGS="--force-stale"
            fi

            echo "Running content enrichment (limit=$LIMIT, force_stale=${FORCE_STALE:-false})"

            # --entrypoint python skips entrypoint.sh (migrations + uvicorn
            # boot) and just runs the one-off script instead. env_file: .env
            # (already configured on this box for the api service) supplies
            # DATABASE_URL — add GROQ_API_KEY to that same .env (NOT
            # XAI_API_KEY: content_enrichment.py only ever reads
            # GROQ_API_KEY — this comment previously said XAI_API_KEY,
            # which meant a box with only XAI_API_KEY set silently ran
            # 100% template-fallback enrichment with no error). This
            # workflow does not pass the key in from GitHub secrets.
            docker compose -f infrastructure/docker/docker-compose.yml \
              run --rm --entrypoint python api \
              scripts/enrich_job_content.py --limit "$LIMIT" $EXTRA_ARGS
        env:
          LIMIT: ${{ github.event.inputs.limit || '100' }}
          FORCE_STALE: ${{ github.event.inputs.force_stale || 'false' }}

      - name: Build job summary (AI vs fallback, per-URL)
        if: always()
        shell: bash
        env:
          # Passed via env (not interpolated directly into the script
          # body) so nothing inside the captured output — which ultimately
          # traces back to scraped, external job postings — can be read
          # as shell syntax.
          SSH_STDOUT: ${{ steps.enrich.outputs.stdout }}
        run: |
          set -e
          # enrich_job_content.py prints one line per job, e.g.:
          #   ENRICH_ROW|AI|https://example.com/job/123|Backend Intern @ Acme
          #   ENRICH_ROW|FALLBACK|https://example.com/job/456|Sales Exec @ Beta
          #   ENRICH_ROW|SKIP||Some Role @ Some Co
          # ssh-action wraps the remote command's stdout between
          # "======CMD======" / "======END======" markers, so this filters
          # to just our own lines rather than assuming the whole output is
          # clean.
          printf '%s' "$SSH_STDOUT" > /tmp/ssh_stdout.txt

          rows_file=/tmp/enrich_rows.txt
          grep '^ENRICH_ROW|' /tmp/ssh_stdout.txt > "$rows_file" || true

          ai_count=$(grep -c '^ENRICH_ROW|AI|'       "$rows_file" || true)
          fallback_count=$(grep -c '^ENRICH_ROW|FALLBACK|' "$rows_file" || true)
          skip_count=$(grep -c '^ENRICH_ROW|SKIP|'   "$rows_file" || true)

          {
            echo "## Content enrichment run"
            echo
            echo "| AI-enriched | Template fallback | Skipped |"
            echo "|---|---|---|"
            echo "| ${ai_count:-0} | ${fallback_count:-0} | ${skip_count:-0} |"
            echo

            if [ -s "$rows_file" ]; then
              echo "<details><summary>Per-job breakdown (${ai_count:-0} AI / ${fallback_count:-0} fallback / ${skip_count:-0} skipped)</summary>"
              echo
              echo "| Result | Job | URL |"
              echo "|---|---|---|"
              while IFS='|' read -r _ tag url job; do
                case "$tag" in
                  AI) icon="🤖 AI" ;;
                  FALLBACK) icon="📄 Fallback" ;;
                  SKIP) icon="⏭️ Skipped" ;;
                  *) icon="$tag" ;;
                esac
                if [ -n "$url" ]; then
                  link="[link]($url)"
                else
                  link="—"
                fi
                echo "| $icon | $job | $link |"
              done < "$rows_file"
              echo
              echo "</details>"
            else
              echo "_No per-job rows were captured — check the raw step log above._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
