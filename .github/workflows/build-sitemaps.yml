# Rebuilds sitemap_cache hourly (migration 028). The web sitemap routes only read
# the prebuilt files, so they no longer depend on live API pagination.
name: Build sitemaps
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Allow the cache to shrink by more than 50%'
        required: false
        default: 'false'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml exec -T api \
              python scripts/build_sitemaps.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
