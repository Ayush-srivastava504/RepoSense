# Drains generation_tasks (migrations/027_generation_tasks.sql) every 20
# minutes so a job the crawler just ingested gets its AI overview within
# the hour, instead of waiting for job-content-enrichment.yml's once-daily
# bulk pass (04:00 UTC). See scripts/run_generation_queue.py for why this
# doesn't replace that bulk pass — it's a fast-lane for freshly-crawled
# rows, the bulk pass stays the backstop for everything else (staleness,
# re-enrichment, tasks that were never enqueued).
#
# Short budget (5 min) because this is meant to run again in 20 minutes
# anyway — small batches, often, not one big batch, rarely. Runs
# --no-fallback like the bulk pass: a row Groq can't handle right now goes
# back on the queue with backoff (see task_queue.fail) rather than getting
# permanent template content, and the bulk pass's --redo-fallback sweep is
# the backstop if backoff alone doesn't clear it after several tries.

name: Queue ingestion (job enrichment)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Tasks claimed per batch'
        required: false
        default: '20'

jobs:
  drain-queue:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and drain the generation queue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 8m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml \
              exec -T api \
              python scripts/run_generation_queue.py \
              --no-fallback \
              --batch-size "${{ github.event.inputs.batch_size || '20' }}" \
              --max-runtime-minutes 5
