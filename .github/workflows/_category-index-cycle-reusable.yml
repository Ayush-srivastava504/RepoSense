# Reusable workflow — the actual SSH-into-EC2 + docker-compose run step,
# shared by all four per-category jobs in category-daily-index.yml so the
# SSH/docker plumbing (identical to phase-f-priority-index.yml and
# queue-ingestion.yml's existing pattern) lives in exactly one place
# instead of being copy-pasted four times.

name: _category-index-cycle-reusable

on:
  workflow_call:
    inputs:
      category:
        required: true
        type: string
      cap:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Run category index cycle on EC2
        id: push
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          envs: CATEGORY,CAP,DRY_RUN
          capture_stdout: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense

            EXTRA_ARGS="--category $CATEGORY"
            if [ -n "$CAP" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --cap $CAP"
            fi
            if [ "${DRY_RUN:-false}" = "true" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --dry-run"
            fi

            echo "Running category index cycle (category=$CATEGORY, cap=${CAP:-default}, dry_run=${DRY_RUN:-false})"

            docker compose -f infrastructure/docker/docker-compose.yml \
              run --rm --entrypoint python api \
              scripts/phase_f_priority_index_push.py $EXTRA_ARGS
        env:
          CATEGORY: ${{ inputs.category }}
          CAP: ${{ inputs.cap }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Log summary
        if: always()
        shell: bash
        env:
          SSH_STDOUT: ${{ steps.push.outputs.stdout }}
        run: |
          set -e
          printf '%s' "$SSH_STDOUT" > /tmp/ssh_stdout.txt
          echo "## Category: ${{ inputs.category }}" >> "$GITHUB_STEP_SUMMARY"
          grep '^PRIORITY_PUSH_ROW|' /tmp/ssh_stdout.txt >> "$GITHUB_STEP_SUMMARY" || echo "(no rows selected)" >> "$GITHUB_STEP_SUMMARY"
