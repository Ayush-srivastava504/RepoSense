# Chained daily loop:  enrich -> sitemap rebuild -> index push (4 categories) -> gone-URL submit.
# Beside the sitemap stage: enrich -> charts (nightly chart_stats aggregation, non-blocking).
# Each stage starts only when the previous one has finished, so IndexNow/Google are never
# told about pages whose enrichment hasn't landed in sitemap_cache yet (previously these ran
# by clock: enrich 04:00, sitemap hourly, index 06:00-07:00). Crawl stays a continuous
# 20-minute container loop; it logs itself to pipeline_runs (stage='crawl').
# Every stage is recorded in pipeline_runs (migration 029) under run_id = this GitHub run id.
#
# Failure policy:
#   enrich fails      -> sitemap + index still run (they act on whatever is already enriched)
#   sitemap fails     -> index and gone are SKIPPED (don't push URLs from a stale/shrunk cache)
#   an index category fails -> the next category and gone still run
name: Daily pipeline (enrich -> sitemap -> index -> gone)

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 09:30 IST
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: 'Max listings to enrich'
        required: false
        default: '100'
      enrich_max_minutes:
        description: 'Enrichment time budget (minutes)'
        required: false
        default: '30'
      dry_run:
        description: 'Index push: select + log only (true/false)'
        required: false
        default: 'false'

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml exec -T api \
              python scripts/pipeline_stage.py --run-id "${{ github.run_id }}" --stage enrich -- \
              python scripts/enrich_all_content.py --target jobs --redo-fallback --no-fallback \
              --max-runtime-minutes "${{ github.event.inputs.enrich_max_minutes || '30' }}" \
              --limit "${{ github.event.inputs.enrich_limit || '100' }}"

  sitemap:
    needs: enrich
    if: ${{ !cancelled() }}   # run even if enrichment failed
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml exec -T api \
              python scripts/pipeline_stage.py --run-id "${{ github.run_id }}" --stage sitemap -- \
              python scripts/build_sitemaps.py

  charts:
    # Nightly shared-chart aggregates (chart_stats, migration 031). Needs enrichment output (skills,
    # experience) but nothing downstream depends on it, so it runs beside the sitemap stage and a
    # failure here never blocks indexing.
    needs: enrich
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml exec -T api \
              python scripts/pipeline_stage.py --run-id "${{ github.run_id }}" --stage charts -- \
              python scripts/build_chart_stats.py

  index-jobs:
    needs: sitemap
    uses: ./.github/workflows/_category-index-cycle-reusable.yml
    with:
      category: jobs
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      run_id: ${{ github.run_id }}
    secrets: inherit

  index-internships:
    needs: [sitemap, index-jobs]
    if: ${{ !cancelled() && needs.sitemap.result == 'success' }}
    uses: ./.github/workflows/_category-index-cycle-reusable.yml
    with:
      category: internships
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      run_id: ${{ github.run_id }}
    secrets: inherit

  index-remote:
    needs: [sitemap, index-internships]
    if: ${{ !cancelled() && needs.sitemap.result == 'success' }}
    uses: ./.github/workflows/_category-index-cycle-reusable.yml
    with:
      category: remote
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      run_id: ${{ github.run_id }}
    secrets: inherit

  index-government:
    needs: [sitemap, index-remote]
    if: ${{ !cancelled() && needs.sitemap.result == 'success' }}
    uses: ./.github/workflows/_category-index-cycle-reusable.yml
    with:
      category: government
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      run_id: ${{ github.run_id }}
    secrets: inherit

  gone:
    # Tell IndexNow engines (Bing/Yandex/Naver/Seznam) about jobs deactivated in the last day.
    # Uses the public API, so it runs on the runner -- no SSH needed.
    needs: [sitemap, index-government]
    if: ${{ !cancelled() && needs.sitemap.result == 'success' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Submit gone URLs to IndexNow
        run: node scripts/indexnow-submit-gone.mjs --since-days=2
        env:
          API_BASE_URL: https://api.intern-flow.in
      - name: Record stage
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml exec -T api \
              python scripts/pipeline_stage.py --run-id "${{ github.run_id }}" --stage gone -- \
              python -c "import sys; sys.exit(${{ job.status == 'success' && '0' || '1' }})"
