name: Daily search pings

# The daily SEO pipeline itself (enrich -> charts -> sitemap -> Indexing API pushes) runs as cron
# on the server: infrastructure/scripts/server-jobs.sh daily, 04:00 UTC. This workflow only does the
# two steps that talk to Google/IndexNow from outside and never needed the server: it runs after the
# server's pipeline has had time to rebuild the sitemaps.

on:
  schedule:
    - cron: '15 5 * * *'   # 05:15 UTC = 10:45 IST, ~75 min after the server's 04:00 run
  workflow_dispatch:

concurrency:
  group: daily-search-pings
  cancel-in-progress: false

jobs:
  gsc-sitemaps:
    # Ask Search Console to re-read the sitemap index + every child (scripts/gsc-submit-sitemaps.mjs).
    # Needs the GSC_SERVICE_ACCOUNT_JSON secret; without it the script logs a notice and passes.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Submit sitemaps to Search Console
        run: node scripts/gsc-submit-sitemaps.mjs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

  gone:
    # Tell IndexNow (Bing, Yandex, ...) which listings closed in the last two days.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Submit gone URLs to IndexNow
        run: node scripts/indexnow-submit-gone.mjs --since-days=2
        env:
          API_BASE_URL: https://api.intern-flow.in
