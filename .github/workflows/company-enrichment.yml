# Fact-only company profiles: aggregates each company's currently listed jobs into
# company_profiles (migrations 019 + 023) via
# services/api/scripts/enrich_all_content.py --target companies.
#
# No Groq and no per-row delay: it is a handful of SQL aggregates per 200 companies,
# so one run covers every company. Runs nightly because the facts (counts, locations,
# dates) change as listings turn over.
#
# Same SSH/EC2 pattern as phase-b-structured-backfill.yml. Needs migration 023 applied
# (the API container's entrypoint runs migrations on deploy).

name: Company profile facts

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max companies to process this run'
        required: false
        default: '5000'

jobs:
  company-facts:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and refresh company profiles
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml \
              exec -T api python scripts/enrich_all_content.py \
              --target companies \
              --limit "${{ github.event.inputs.limit || '5000' }}"
