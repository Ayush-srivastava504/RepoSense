name: Backend CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "infrastructure/docker/**"
      - ".github/workflows/backend-cicd.yml"
      - "tests/**"

  pull_request:
    branches: [master]
    paths:
      - "services/api/**"
      - "tests/**"
      - "apps/web/**"

  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Target environment (production / staging)"
        required: false
        default: "production"

  schedule:
    - cron: "*/15 * * * *"

jobs:
  test:
    name: Run Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: internship_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: services/api

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/internship_db_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-key-32-chars-long!!
      GITHUB_CLIENT_ID: ci-fake-client-id
      GITHUB_CLIENT_SECRET: ci-fake-client-secret
      GITHUB_REDIRECT_URI: http://localhost:3000/api/github/callback
      GITHUB_TOKEN_ENCRYPTION_KEY: dGVzdGtleS10ZXN0a2V5LXRlc3RrZXktdGVzdA==
      FRONTEND_URL: http://localhost:3000
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Run database migrations
        run: python run_migrations.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/internship_db_test

      - name: Run import smoke test
        run: python test_imports.py

      - name: Run API unit tests (services/api/tests)
        env:
          PYTHONPATH: .:src
        run: pytest tests/ --tb=short -v -p no:cacheprovider

      - name: Set up Node 20 (web unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit tests (sitemap + 410 gone-jobs)
        working-directory: apps/web
        run: npx --yes tsx --test tests/*.test.ts

      - name: Run pytest with coverage
        run: |
          pytest ../../tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: services/api/coverage.xml

  build:
    name: Build and Push Images
    needs: test
    if: >
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: true
          tags: |
            ghcr.io/ayush-srivastava504/reposense-api:latest
            ghcr.io/ayush-srivastava504/reposense-api:${{ github.sha }}

      - name: Build and Push Crawler Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api/crawler
          file: ./services/api/crawler/Dockerfile
          push: true
          tags: |
            ghcr.io/ayush-srivastava504/reposense-crawler:latest
            ghcr.io/ayush-srivastava504/reposense-crawler:${{ github.sha }}

      # NEXT_PUBLIC_* values are baked into the browser bundle here, at build time.
      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.intern-flow.in
            NEXT_PUBLIC_API_BASE_URL=https://api.intern-flow.in
            NEXT_PUBLIC_SITE_URL=https://intern-flow.in
            NEXT_PUBLIC_LOGO_DEV_TOKEN=${{ secrets.NEXT_PUBLIC_LOGO_DEV_TOKEN }}
            API_BASE_URL=https://api.intern-flow.in
          tags: |
            ghcr.io/ayush-srivastava504/reposense-web:latest
            ghcr.io/ayush-srivastava504/reposense-web:${{ github.sha }}


  # No deploy job: the server pulls its own deploys (infrastructure/scripts/auto-deploy.sh, cron every
  # 5 min), so the :latest images pushed above go live within ~5 minutes without GitHub needing SSH.

  health_monitor:
    name: Health Monitor
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check the public site and API over HTTPS
        run: |
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || echo 000)
            if [ "$code" = 200 ]; then echo "ok   $1"; else echo "FAIL $1 -> $code"; fail=1; fi
          }
          check "Website"     https://intern-flow.in/
          check "API"         https://api.intern-flow.in/health
          check "Sitemap"     https://intern-flow.in/sitemap.xml
          exit $fail

      - name: Alert on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.ALERT_WEBHOOK }}" ]; then
            curl -s -X POST "${{ secrets.ALERT_WEBHOOK }}"               -H "Content-Type: application/json"               -d '{"text":"intern-flow.in health check FAILED: see GitHub Actions."}'
          fi
