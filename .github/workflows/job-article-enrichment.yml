# Writes the 1,500+ word, job-specific guide for every job page (scripts/enrich_all_content.py --target article,
# stored in jobs.enriched_sections->'article'). Order: Big 4 / FAANG-level, top startups, other top companies,
# mass hiring, then everything else, newest first inside each tier.
#
# Nothing is stored unless the article is at least 1,500 words AFTER validation (invented numbers, filler and
# phrasing shared with other published articles are cut), so a failed row is simply retried on the next run.
# Only jobs with a published article are listed in the job sitemaps (apps/web/lib/jobContent.ts), so every run
# adds more indexable pages.
#
# Runs every 3 hours inside the api container, same pattern as job-content-enrichment.yml. Exits 2 if no AI
# key is visible, 3 if rows were attempted but none passed, so a broken run shows up red.

name: Job article enrichment

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max listings this run (upper bound; the time budget usually ends the run first)'
        required: false
        default: '150'
      max_minutes:
        description: 'Stop starting new rows after this many minutes'
        required: false
        default: '40'

concurrency:
  group: job-article-enrichment
  cancel-in-progress: false

jobs:
  enrich-articles:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and write job articles
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 55m
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/RepoSense
            docker compose -f infrastructure/docker/docker-compose.yml \
              exec -T api \
              python scripts/enrich_all_content.py \
              --target article --no-fallback \
              --max-runtime-minutes "${{ github.event.inputs.max_minutes || '40' }}" \
              --limit "${{ github.event.inputs.limit || '150' }}"
